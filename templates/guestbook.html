<!DOCTYPE html>

<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Min gästbok</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        background-color: #f2f2f2;
    }

    h1 {
        text-align: center;
    }

    form {
        background-color: white;
        padding: 20px;
        margin-bottom: 30px;
        border-radius: 10px;
    }

    label {
        font-weight: bold;
    }

    input,
    textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        box-sizing: border-box;
    }

    textarea {
        height: 100px;
    }

    button {
        padding: 10px 20px;
        cursor: pointer;
    }

    .post {
        background-color: white;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 10px;
    }

    .time {
        color: gray;
        font-size: 14px;
    }
</style>

</head>

<body>

<h1>Min gästbok</h1>

<form action="/add" method="POST">

    <label for="name">Namn:</label>
    <input type="text" id="name" name="name" required>

    <label for="message">Meddelande:</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit">Spara</button>

</form>

<h2>Inlägg</h2>

{% for post in posts %}

    {% set parts = post.strip().split("|") %}

    <div class="post">

        <h3>{{ parts[0] }}</h3>

        <p>{{ parts[2] }}</p>

        <div class="time">
            {{ parts[1] }}
        </div>

    </div>

{% endfor %}


</body>

</html>
